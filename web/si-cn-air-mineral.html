<title>SI CN Air Mineral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar kerja (desktop) / laci + topbar (HP); halaman = header, ringkasan, tabel */
:root{
  --bg:#eef3f4; --surface:#ffffff; --surface-2:#f6f9fa; --ink:#0f2830; --muted:#587078; --line:#d7e2e5;
  --accent:#0a6c86; --accent-ink:#ffffff; --accent-soft:#dff0f4; --accent-2:#79c3d6;
  --ok:#1d7a4c; --ok-soft:#e1f3e9; --warn:#a2610a; --warn-soft:#fbefd9; --bad:#b0281f; --bad-soft:#fbe4e1;
  --side:#0d2f3a; --side-ink:#d7ebf0; --side-muted:#86a8b2; --side-act:#164a59;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,40,48,.06),0 6px 20px rgba(15,40,48,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b171b; --surface:#122329; --surface-2:#0f1e23; --ink:#e3eef1; --muted:#90a8b0; --line:#22383f;
  --accent:#4fb6d1; --accent-ink:#06222a; --accent-soft:#143843; --accent-2:#2c7f95;
  --ok:#5cc58f; --ok-soft:#123326; --warn:#e5a54a; --warn-soft:#3a2a10; --bad:#f07c72; --bad-soft:#3d1916;
  --side:#08151a; --side-ink:#d7ebf0; --side-muted:#7c9aa3; --side-act:#143843;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b171b; --surface:#122329; --surface-2:#0f1e23; --ink:#e3eef1; --muted:#90a8b0; --line:#22383f;
  --accent:#4fb6d1; --accent-ink:#06222a; --accent-soft:#143843; --accent-2:#2c7f95;
  --ok:#5cc58f; --ok-soft:#123326; --warn:#e5a54a; --warn-soft:#3a2a10; --bad:#f07c72; --bad-soft:#3d1916;
  --side:#08151a; --side-ink:#d7ebf0; --side-muted:#7c9aa3; --side-act:#143843;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;padding-block:18px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px}
.brand svg,.logo{flex:none}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;box-sizing:border-box}
.lhead .logo{width:64px;height:64px}
.rh .logo{width:52px;height:52px;padding:0}
.np .nh .logo{width:54px;height:54px;padding:0;display:block;margin:0 auto 4px}
.brand b{display:block;font-weight:800;letter-spacing:.01em;font-size:15px}
.brand span{display:block;font-size:11.5px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-muted);padding:14px 10px 4px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--side-act);color:#fff;font-weight:700}
.nav button:focus-visible{outline:2px solid var(--accent-2)}
.nav .badge{background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.who{border-top:1px solid rgba(255,255,255,.08);margin-top:12px;padding:12px 6px 0;font-size:12.5px;display:grid;gap:8px}
.who .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.who b{font-size:13.5px}
.mode{font-size:11.5px;color:var(--side-muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.loc{background:var(--warn)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent-2);font-weight:600;font-size:12.5px}
.topbar{display:none}
.main{min-width:0;padding-block:22px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}
.scrim{display:none}

@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:40;transform:translateX(-100%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(5,20,25,.45);z-index:35}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--side);color:var(--side-ink);align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar button{all:unset;cursor:pointer;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.16);font-weight:600;font-size:13px}
  .topbar b{font-weight:800;flex:1}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* page */
.ph{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.ph h1{font-size:23px;font-weight:800;letter-spacing:-.01em}
.ph p{margin:3px 0 0;color:var(--muted);max-width:68ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters label{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 small{font-weight:500;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl .l,.kpi.hl .s{color:var(--accent-ink);opacity:.85}
.kpi.warn{border-left:4px solid var(--warn)}
.kpi.bad{border-left:4px solid var(--bad)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:10px 11px}.kpi .v{font-size:17px}.kpi .l{font-size:10.5px}.kpi .s{font-size:11.5px}}
.kpi.btnlike{appearance:none;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi.btnlike.sel{outline:2px solid var(--accent)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:800;background:var(--surface-2);border-top:1px solid var(--line)}
td .sub{display:block;font-size:11.5px;color:var(--muted)}
td.act{white-space:nowrap;text-align:right}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.zone{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
.zone.LK{color:var(--warn);border-color:var(--warn)}
.zone.DK{color:var(--accent);border-color:var(--accent)}
.warnt{color:var(--warn);font-weight:600}
.badt{color:var(--bad);font-weight:600}
.okt{color:var(--ok);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px;color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft,#fde8e8)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .t{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pl{display:grid;gap:0}
.pl .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.pl .row.tot{font-weight:800;border-bottom:0;border-top:2px solid var(--ink);margin-top:4px}
.pl .row.sub{color:var(--muted);font-size:12.5px;padding-left:12px}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.alert .lv{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--muted)}
.alert .lv.bad{background:var(--bad)} .alert .lv.warn{background:var(--warn)} .alert .lv.ok{background:var(--ok)}
.alert b{display:block}
.alert span{color:var(--muted);font-size:12.5px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--side) 0 260px,var(--bg) 260px)}
.lbox{width:min(760px,100%);display:grid;gap:18px}
.lhead{color:var(--side-ink);display:flex;gap:14px;align-items:center}
.lhead h1{font-size:26px;font-weight:800}
.lhead p{margin:2px 0 0;color:var(--side-muted)}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.roles{grid-template-columns:minmax(0,1fr)}}
.role{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px;box-shadow:var(--shadow)}
.role:hover,.role.on{border-color:var(--accent)}
.role.on{outline:2px solid var(--accent)}
.role:focus-visible{outline:2px solid var(--accent)}
.role b{font-size:16px}
.role span{color:var(--muted);font-size:13px}
.names{display:flex;flex-wrap:wrap;gap:8px}

/* modal */
.mback{position:fixed;inset:0;background:rgba(5,20,25,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) 28px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(680px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-size:16px;font-weight:800}
.mb{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:560px){.mb{grid-template-columns:minmax(0,1fr)}}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.mf .err{color:var(--bad);font-weight:600;margin-right:auto;font-size:13px}
.field{display:grid;gap:4px;min-width:0;align-content:start}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field .req{color:var(--bad)}
.field input,.field select,.field textarea{width:100%}
.field .hint{font-size:12px;color:var(--muted);min-height:0}
.field .hint:empty{display:none}
.full{grid-column:1/-1}
.fsep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.check{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.sum{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:13px}
.sum .r{display:flex;justify-content:space-between;gap:10px}
.sum .r b{font-variant-numeric:tabular-nums}
.sum .big{font-size:17px;font-weight:800}
.mini{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
pre.nota{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;margin:0;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;max-width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.quick .btn{justify-content:center;padding:16px;font-size:15px}
.modal.xwide{width:min(1240px,100%)}
.gi input{width:94px;padding:5px 6px;text-align:right}
.gi td{padding:5px 6px;vertical-align:middle}
.gi th{position:static}

/* laporan cetak */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:18px;max-width:1100px}
.rh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.rh-l{display:flex;gap:10px;align-items:center}.rh-l b{display:block;font-size:15px;font-weight:800}.rh-l span{font-size:12px;color:var(--muted)}
.rh-r{text-align:right}.rh-r h1{font-size:21px;font-weight:800}.rh-r p{margin:2px 0 0;font-size:13px}
.rs{display:grid;gap:10px;min-width:0}
.rs h2{font-size:16px;font-weight:800;display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.rs h2 .no{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:12px}
.rs h2 small{font-weight:500;color:var(--muted);font-size:12px}
.rs .h3{font-size:13px;font-weight:800;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rs .h3:first-child{margin-top:0}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.rk{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:1px;min-width:0;background:var(--surface-2)}
.rk span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.rk b{font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rk small{font-size:11.5px;color:var(--muted)}
.fn{font-size:12px;color:var(--muted);margin:2px 0 0}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.ins li{border-left:4px solid var(--muted);padding:6px 10px;background:var(--surface-2);border-radius:0 8px 8px 0}
.ins li.ok{border-color:var(--ok)}.ins li.warn{border-color:var(--warn)}.ins li.bad{border-color:var(--bad)}.ins li.info{border-color:var(--accent)}
.ins b{display:block}.ins span{font-size:12.5px;color:var(--muted)}
.sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:10px;text-align:center;font-size:12.5px;break-inside:avoid}
.sign i{display:block;height:58px;border-bottom:1px solid var(--ink);margin:4px 12px}
.sign b{display:block;margin-top:4px}
@media (max-width:560px){.rep{padding:14px}.rh-r{text-align:left}.sign{grid-template-columns:minmax(0,1fr)}}
@media print{
  html,body{background:#fff!important}
  body::before,.side,.topbar,.scrim,.noprint,#modal-root,.toast{display:none!important}
  .shell{display:block}.main{padding:0!important;max-width:none}

  const utangByKode=Object.fromEntries(utang.map(u=>[u.kode,u]));

  // KARTU_STOK_JADI: H = B + C − D − E + F − G (harian)
  const s0=S.tgl_stok_awal; const ag={}; const A=(d,k,v)=>{if(!d||d<s0)return;(ag[d]??={prod:0,reject:0,jual:0,bonus:0,masuk:0,keluar:0})[k]+=v};

  let last=TODAY; Object.keys(ag).forEach(d=>{if(d>last)last=d});

  for(let d=s0, guard=0; d<=last&&guard<4000; d=addDays(d,1),guard++){const a=ag[d]||{prod:0,reject:0,jual:0,bonus:0,masuk:0,keluar:0};const awal=s;s=awal+a.prod-a.jual-a.bonus+a.masuk-a.keluar;stokAt[d]=s;kartu.push({tanggal:d,awal,...a,akhir:s});if(s<0&&(!minStok||s<minStok.akhir))minStok={tanggal:d,akhir:s}}
  const stokNow=stokAt[TODAY]??s;
  const opname=D.opname.map(o=>{const teo=stokAt[o.tanggal]??null;return {...o,teo,selisih:teo==null?null:N(o.fisik)-teo}}).sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));

  // Harga rata-rata pembelian per bahan
  const beli={}; sup.forEach(x=>x.items.forEach(i=>{const b=(beli[i.bahan]??={q:0,v:0});b.q+=N(i.qty);b.v+=N(i.qty)*N(i.harga)}));
  const hargaBahan=id=>beli[id]?.q?beli[id].v/beli[id].q:N(bah[id]?.harga_acuan);
  // BAHAN BAKU: pemakaian = catatan manual bila ada, selain itu otomatis = produksi × resep
  const prodByDate={}; D.produksi.forEach(p=>prodByDate[p.tanggal]=(prodByDate[p.tanggal]||0)+N(p.aktual));
  const auto=S.bahan_otomatis!==false; const pkBy=Object.fromEntries(D.pemakaian.map(p=>[p.tanggal,p]));
  const bEv=[];
  sup.forEach(x=>x.items.forEach(i=>bEv.push({tanggal:x.tanggal,bahan:i.bahan,masuk:N(i.qty),pakai:0,rijek:0,koreksi:0})));
  new Set([...Object.keys(prodByDate),...Object.keys(pkBy)]).forEach(t=>{const p=pkBy[t];bahan.forEach(b=>{const it=p?.items?.[b.id]||{};const man=N(it.pakai)>0;const pakai=man?N(it.pakai):(auto?(prodByDate[t]||0)*N(b.per_dus):0);const rj=N(it.rijek),kr=N(it.koreksi);if(pakai||rj||kr)bEv.push({tanggal:t,bahan:b.id,masuk:0,pakai,rijek:rj,koreksi:kr,manual:man})})});
  const stokBahan={}; bahan.forEach(b=>stokBahan[b.id]={awal:N(b.saldo_awal),masuk:0,koreksi:0,pakai:0,rijek:0,akhir:0});
  bEv.forEach(e=>{if(e.tanggal<s0||!stokBahan[e.bahan])return;const x=stokBahan[e.bahan];x.masuk+=e.masuk;x.pakai+=e.pakai;x.rijek+=e.rijek;x.koreksi+=e.koreksi});

  const AK=S.akun; const akOf=(r,met)=>r.akun&&AK.includes(r.akun)?r.akun:(met&&met!=='Tunai'&&AK[1]?AK[1]:AK[0]);
  const k0=S.tgl_mulai_kas; const led=[];
  D.pembayaran.forEach(b=>{if(!KAS_MASUK.includes(b.jenis))return;const kind=b.jenis==='Penjualan tunai'?'tunai':b.jenis==='Penagihan piutang'?'kredit':'lain';led.push({tanggal:b.tanggal,akun:akOf(b,b.metode),kind,sumber:'Penerimaan',ket:b.jenis+' · '+(b.pembayar||'')+(b.ref?' · '+b.ref:''),masuk:N(b.nominal),keluar:0})});
  D.hutang_lain.forEach(h=>{if(N(h.dana_masuk)>0)led.push({tanggal:h.tanggal,akun:akOf(h),kind:'pinjaman',sumber:'Pinjaman masuk',ket:(kre[h.kreditur]?.nama||'')+' · '+h.kode,masuk:N(h.dana_masuk),keluar:0})});
  D.pengeluaran.forEach(e=>{if(L.kategoriTerkunci.includes(e.kategori)||String(e.kategori||'').startsWith('Pembelian bahan baku'))return;led.push({tanggal:e.tanggal,akun:akOf(e,e.metode),kind:'ops',sumber:'Pengeluaran',ket:e.kategori+' · '+(e.keterangan||''),masuk:0,keluar:N(e.nominal)})});
  D.bayar_hutang.forEach(b=>led.push({tanggal:b.tanggal,akun:akOf(b,b.metode),kind:'hutang',sumber:'Bayar hutang',ket:b.id_utang+' · '+(utangByKode[b.id_utang]?.nama||''),masuk:0,keluar:N(b.pokok)+N(b.bunga)+N(b.biaya)}));
  sup.forEach(x=>{if(x.cara==='Tunai')led.push({tanggal:x.tanggal,akun:akOf(x),kind:'beli',sumber:'Pembelian tunai',ket:x.kreNama+' · '+x.no,masuk:0,keluar:x.total})});
  D.gaji.forEach(g=>{if(g.status==='Dibayar')led.push({tanggal:g.tanggal_bayar||g.tanggal,akun:akOf(g),kind:'gaji',sumber:'Gaji',ket:g.nama||'',masuk:0,keluar:gajiBersih(g)})});
  D.transfer.forEach(t=>{const ket=`${t.dari} → ${t.ke}`+(t.catatan?' · '+t.catatan:'');led.push({tanggal:t.tanggal,akun:t.dari,kind:'trfOut',sumber:'Setor/transfer',ket,masuk:0,keluar:N(t.nominal),tid:t.id});led.push({tanggal:t.tanggal,akun:t.ke,kind:'trfIn',sumber:'Setor/transfer',ket,masuk:N(t.nominal),keluar:0,tid:t.id})});
  led.sort((a,b)=>(a.tanggal||'').localeCompare(b.tanggal||'')||b.masuk-a.masuk);
  const saldoAwal={}; AK.forEach((a,i)=>saldoAwal[a]=i===0?N(S.saldo_awal_kas):N(S.saldo_awal_akun?.[a]));
  const sal={...saldoAwal}; let tot=AK.reduce((x,a)=>x+saldoAwal[a],0); const ledger=[]; let kasMin=null;
  led.forEach(r=>{if(!r.tanggal||r.tanggal<k0)return;if(!(r.akun in sal))sal[r.akun]=0;sal[r.akun]+=r.masuk-r.keluar;tot+=r.masuk-r.keluar;ledger.push({...r,saldoAkun:sal[r.akun],saldo:tot});if(sal[r.akun]<0&&(!kasMin||sal[r.akun]<kasMin.saldo))kasMin={tanggal:r.tanggal,saldo:sal[r.akun],akun:r.akun}});
  const kasAkun={...saldoAwal}; ledger.forEach(r=>{if(r.tanggal<=TODAY)kasAkun[r.akun]=(kasAkun[r.akun]||0)+r.masuk-r.keluar});
  const kasNow=Object.values(kasAkun).reduce((a,b)=>a+b,0);

  const harga=[...D.harga].sort((a,b)=>(b.berlaku||'').localeCompare(a.berlaku||''));
  return {S,pel,wil,bah,kar,kre,bahan,inv,invByNo,piutang,piutangPel,sup,hl,utang,utangByKode,kartu,stokAt,stokNow,minStok,opname,beli,hargaBahan,stokBahan,prodByDate,ledger,kasNow,kasMin,harga,bEv,auto,saldoAwal,kasAkun};
}
function gajiBersih(g){ // GAJI: gaji tetap + tunjangan + upah×hari + dus×insentif + dus×bonus + lembur − potongan

}

/* Rekap bulanan (LAPORAN_OWNER_BULANAN / TAHUNAN) */
function bulan(m){
  const c=C(); const r={pj:0,dus:0,bonus:0,tunai:0,kredit:0,inv:0,kasPel:0,belanjaBahan:0,beliTunai:0,ops:0,bayarHutang:0,bunga:0,pinjaman:0,gaji:0,prod:0,reject:0,target:0,kontainer:0,ongkir:0,prive:0,masuk:0,keluar:0};
  c.inv.forEach(i=>{if(!inM(i.tanggal,m))return;r.pj+=i.bersih;r.dus+=N(i.dus)-N(i.retur);r.bonus+=N(i.bonus);r.inv++;i.jenis==='Tunai'?r.tunai+=i.bersih:r.kredit+=i.bersih});
  D.pembayaran.forEach(b=>{if(inM(b.tanggal,m)&&(b.jenis==='Penjualan tunai'||b.jenis==='Penagihan piutang'))r.kasPel+=N(b.nominal)});
  c.sup.forEach(s=>{if(inM(s.tanggal,m)){r.belanjaBahan+=s.total;if(s.cara==='Tunai')r.beliTunai+=s.total}});
  D.pengeluaran.forEach(e=>{if(!inM(e.tanggal,m)||L.kategoriTerkunci.includes(e.kategori))return;if(L.kategoriNonLaba.includes(e.kategori)){r.prive+=N(e.nominal);return}r.ops+=N(e.nominal);if(e.kategori==='Biaya kontainer')r.kontainer+=N(e.nominal)});
  D.inv_supplier.forEach(x=>{if(inM(x.tanggal,m)&&N(x.ongkir))r.ongkir+=N(x.ongkir)});
  D.bayar_hutang.forEach(b=>{if(inM(b.tanggal,m)){r.bayarHutang+=N(b.pokok)+N(b.bunga)+N(b.biaya);r.bunga+=N(b.bunga)+N(b.biaya)}});
  D.hutang_lain.forEach(h=>{if(inM(h.tanggal,m))r.pinjaman+=N(h.dana_masuk)});
  D.gaji.forEach(g=>{if(inM(g.tanggal,m)&&g.status==='Dibayar')r.gaji+=gajiBersih(g)});
  D.produksi.forEach(p=>{if(inM(p.tanggal,m)){r.prod+=Math.max(0,N(p.aktual)-N(p.reject));r.reject+=N(p.reject);r.target+=N(p.target)}});
  c.ledger.forEach(l=>{if(inM(l.tanggal,m)){r.masuk+=l.masuk;r.keluar+=l.keluar}});
  r.arus=r.masuk-r.keluar;
  return r;
}
/* HPP bulanan (sheet HPP) */
function hpp(m){
  const c=C(); const b=bulan(m);
  const rows=c.bahan.map(x=>{let pakai=0,rijek=0;c.bEv.forEach(e=>{if(e.bahan===x.id&&inM(e.tanggal,m)){pakai+=e.pakai;rijek+=e.rijek}});const h=c.hargaBahan(x.id);return {...x,pakai,rijek,harga:h,biaya:(pakai+rijek)*h,sumber:c.beli[x.id]?.q?'rata-rata beli':'harga acuan'}});
  const totBahan=rows.reduce((a,r)=>a+r.biaya,0);
  const totProd=totBahan+b.kontainer+b.ongkir;
  const perDus=b.prod>0&&totBahan>0?totProd/b.prod:null;
  const std=c.bahan.reduce((a,x)=>a+N(x.per_dus)*c.hargaBahan(x.id),0);
  const pakaiPerDus=perDus??std;
  const hppJual=b.dus*pakaiPerDus, biayaBonus=b.bonus*pakaiPerDus;
  const labaKotor=b.pj-hppJual-biayaBonus;
  const opsNonKont=b.ops-b.kontainer;
  const laba=labaKotor-opsNonKont-b.gaji-b.bunga;
  return {rows,totBahan,kontainer:b.kontainer,totProd,perDus,std,pakaiPerDus,b,hppJual,biayaBonus,labaKotor,opsNonKont,laba,aktual:perDus!=null};
}

/* VALIDASI_DATA — pemeriksaan otomatis */
function checks(){
  const c=C(), out=[]; const add=(lv,judul,detail,go)=>out.push({lv,judul,detail,go});
  const lebih=c.inv.filter(i=>i.valid==='LEBIH'); if(lebih.length)add('bad',`${lebih.length} invoice dibayar melebihi tagihan`,lebih.slice(0,4).map(i=>i.no).join(', '),'penerimaan');
  const noRef=D.pembayaran.filter(b=>b.jenis==='Penagihan piutang'&&(!b.ref||!c.invByNo[b.ref])); if(noRef.length)add('bad',`${noRef.length} penagihan tanpa nomor invoice yang valid`,'Pembayaran tidak akan mengurangi piutang.','penerimaan');
  const lewat=c.piutang.filter(i=>i.lewat>0); if(lewat.length)add(lewat.some(i=>i.lewat>90)?'bad':'warn',`${lewat.length} invoice lewat jatuh tempo · ${rp(lewat.reduce((a,i)=>a+i.sisa,0))}`,`${lewat.filter(i=>i.lewat>90).length} di antaranya lewat lebih dari 90 hari.`,'piutang');
  const tunaiBelum=c.inv.filter(i=>i.jenis==='Tunai'&&i.sisa>0); if(tunaiBelum.length)add('warn',`${tunaiBelum.length} penjualan tunai belum ada penerimaan uang`,tunaiBelum.slice(0,4).map(i=>i.no).join(', '),'penerimaan');
  const bedaHarga=c.inv.filter(i=>{const h=i.pl&&hargaBerlaku(i.pl.wilayah,i.jenis,i.tanggal);return h!=null&&N(i.harga)!==h}); if(bedaHarga.length)add('warn',`${bedaHarga.length} penjualan memakai harga di luar daftar harga`,'Cek apakah diskon khusus atau salah ketik.','penjualan');
  const noHarga=c.inv.filter(i=>i.pl&&hargaBerlaku(i.pl.wilayah,i.jenis,i.tanggal)==null); if(noHarga.length)add('warn',`${noHarga.length} penjualan di wilayah/jenis yang belum punya daftar harga`,'Lengkapi di Master Data → Wilayah & Harga.','master');
  const overLimit=D.pelanggan.filter(p=>N(p.limit_kredit)>0&&(c.piutangPel[p.id]||0)>N(p.limit_kredit)); if(overLimit.length)add('warn',`${overLimit.length} pelanggan melewati limit kredit`,overLimit.slice(0,4).map(p=>p.nama).join(', '),'piutang');
  if(c.minStok)add('bad','Stok barang jadi pernah negatif',`Terendah ${nf(c.minStok.akhir,0)} dus pada ${tgl(c.minStok.tanggal)}. Ada penjualan tanpa produksi tercatat, atau saldo awal salah.`,'stok');
  if(c.stokNow>N(c.S.target_harian)*20)add('warn',`Stok barang jadi teoritis ${nf(c.stokNow,0)} dus — tidak wajar`,'Lebih dari 20 hari produksi. Biasanya karena produksi dicatat tapi penjualan belum lengkap. Lakukan stock opname.','stok');
  const negB=c.bahan.filter(b=>c.stokBahan[b.id]?.akhir<0); if(negB.length)add('bad',`Stok bahan baku negatif: ${negB.map(b=>b.nama).join(', ')}`,'Pembelian belum dicatat atau pemakaian berlebih.','bahan');
  const sel=c.opname.filter(o=>o.selisih)[0]; if(sel)add(sel.selisih<0?'bad':'warn',`Selisih stock opname ${nf(sel.selisih,0)} dus (${tgl(sel.tanggal)})`,sel.selisih<0?'Fisik lebih sedikit dari catatan — kemungkinan besar ada penjualan yang belum diinput. Cek menu Cocokkan Gudang sebelum membuat koreksi.':'Fisik lebih banyak — cek produksi yang belum dicatat atau penjualan yang tercatat dobel.','cocok');
  const ck=cocok().filter(r=>r.sel>0); if(ck.length)add('bad',`${nf(ck.reduce((a,r)=>a+r.sel,0),0)} dus keluar gudang belum ada nota penjualan`,ck.slice(0,4).map(r=>`${r.sales} ${tgl(r.tanggal)}: ${r.sel} dus`).join(', '),'cocok');
  const korOto=D.mutasi.filter(m=>m.jenis==='Koreksi'&&m.arah==='Keluar'&&/otomatis/i.test(m.catatan||'')); if(korOto.length)add('warn',`${korOto.length} koreksi stok otomatis (keluar ${nf(korOto.reduce((a,m)=>a+N(m.qty),0),0)} dus)`,'Koreksi keluar sering menutupi penjualan yang belum diinput. Telusuri dulu, lalu hapus koreksinya jika notanya sudah masuk.','stok');
  {const lastJ=c.inv.reduce((a,i)=>i.tanggal>a?i.tanggal:a,''); const pAfter=D.produksi.filter(p=>p.tanggal>lastJ).length; if(lastJ&&pAfter>=2&&lastJ<addDays(TODAY,-2))add('bad',`Tidak ada nota penjualan sejak ${tgl(lastJ)}`,`Padahal ada ${pAfter} hari produksi sesudahnya. Pastikan sales menginput semua nota.`,'penjualan');}
  if(!D.keluar.length&&D.penjualan.length)add('warn','Gudang belum mencatat barang keluar harian','Tanpa catatan muatan gudang, penjualan yang lupa diinput tidak bisa terdeteksi. Gunakan menu Cocokkan Gudang.','cocok');
  const noPakai=c.auto?[]:D.produksi.filter(p=>!D.pemakaian.some(x=>x.tanggal===p.tanggal)); if(noPakai.length)add('warn',`${noPakai.length} hari produksi belum ada catatan pemakaian bahan`,'HPP bulan tersebut tidak akurat.','bahan');
  let dev=0; D.pemakaian.forEach(p=>{const prod=c.prodByDate[p.tanggal]||0;if(!prod)return;c.bahan.forEach(b=>{const std=prod*N(b.per_dus),a=N(p.items?.[b.id]?.pakai);if(std>0&&a>0&&Math.abs(a-std)/std>0.1)dev++})}); if(dev)add('warn',`${dev} catatan pemakaian bahan menyimpang >10% dari standar`,'Bisa pemborosan, bocor, atau salah input.','bahan');
  const jt=c.utang.filter(u=>u.sisa>0&&u.jatuh_tempo&&u.jatuh_tempo<=addDays(TODAY,7)); if(jt.length)add(jt.some(u=>u.jatuh_tempo<TODAY)?'bad':'warn',`${jt.length} hutang jatuh tempo ≤ 7 hari · ${rp(jt.reduce((a,u)=>a+u.sisa,0))}`,jt.slice(0,3).map(u=>u.nama).join(', '),'hutang');
  const salahModul=D.pengeluaran.filter(e=>/angsur|cicil|bayar (hutang|utang)|pinjam/i.test(e.keterangan||'')); if(salahModul.length)add('warn',`${salahModul.length} pengeluaran terlihat seperti pembayaran hutang`,salahModul.map(e=>`"${e.keterangan}" ${rp(e.nominal)}`).slice(0,3).join(', ')+' — seharusnya dicatat di Hutang → Bayar hutang.','pengeluaran');
  if(c.kasMin&&c.kasMin.saldo<0)add('bad',`Saldo ${c.kasMin.akun} teoritis pernah minus`,`${rp(c.kasMin.saldo)} pada ${tgl(c.kasMin.tanggal)}. Cek saldo awal kas atau penerimaan yang belum dicatat.`,'kas');
  const sn=new Set(D.karyawan.map(k=>String(k.nama).toUpperCase())); const asing=[...new Set(D.penjualan.map(p=>p.sales).filter(s=>s&&!sn.has(String(s).toUpperCase())))]; if(asing.length)add('warn',`Sales tidak terdaftar di master karyawan: ${asing.join(', ')}`,'Tambahkan di Master Data → Karyawan dengan jabatan Sales.','master');
  const pelTanpaW=D.pelanggan.filter(p=>!c.wil[p.wilayah]); if(pelTanpaW.length)add('warn',`${pelTanpaW.length} pelanggan belum punya wilayah`,'Harga otomatis tidak bisa dihitung.','master');
  if(!out.length)add('ok','Tidak ada masalah terdeteksi','Tetap cocokkan kas fisik, rekening, dan stok gudang secara berkala.',null);
  // SJPH Tahap 1: sertifikat halal bahan dan pengecekan penerimaan
  const bahanTanpaSH=(D.bahan||[]).filter(b=>b.status_halal!==HALAL_STATUS[1]&&!String(b.no_sh||'').trim());
  if(bahanTanpaSH.length)add('warn',`${bahanTanpaSH.length} bahan belum punya nomor sertifikat halal`,bahanTanpaSH.slice(0,4).map(b=>b.nama).join(', '),'bahan');
  const shLewat=(D.bahan||[]).filter(b=>b.tgl_sh_berlaku&&hariKe(b.tgl_sh_berlaku)<0);
  if(shLewat.length)add('bad',`${shLewat.length} sertifikat halal bahan sudah lewat masa berlaku`,shLewat.slice(0,4).map(b=>b.nama).join(', '),'bahan');
  const shSegera=(D.bahan||[]).filter(b=>b.tgl_sh_berlaku&&hariKe(b.tgl_sh_berlaku)>=0&&hariKe(b.tgl_sh_berlaku)<=60);
  if(shSegera.length)add('warn',`${shSegera.length} sertifikat halal bahan habis dalam 60 hari`,shSegera.slice(0,4).map(b=>b.nama).join(', '),'bahan');
  const belumCek=(D.inv_supplier||[]).filter(i=>i.halal_cek!==true&&i.tanggal&&hariKe(i.tanggal)>=-60);
  if(belumCek.length)add('warn',`${belumCek.length} penerimaan bahan 60 hari terakhir belum dicek Daftar Bahan Halal`,belumCek.slice(0,4).map(i=>i.no).join(', '),'pembelian');
  return out;
}

function barChart(series,keys,colors,labels){
  const W=600,H=250,pl=58,pr=8,pt=12,pb=30; const mx=Math.max(1,...series.flatMap(s=>keys.map(k=>s[k])));
  const p=10**Math.floor(Math.log10(mx)); const top=Math.ceil(mx/p)*p; const ticks=4;
  const gw=(W-pl-pr)/series.length, bw=Math.min(20,(gw-6)/keys.length);
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g=''; for(let i=0;i<=ticks;i++){const v=top*i/ticks;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="13" fill="var(--muted)">${rpS(v)}</text>`}
  series.forEach((s,i)=>{const x0=pl+i*gw+(gw-bw*keys.length)/2;keys.forEach((k,j)=>{const v=s[k];const yy=y(v);g+=`<rect x="${x0+j*bw}" y="${yy}" width="${bw-2}" height="${Math.max(0,H-pb-yy)}" rx="2" fill="${colors[j]}"><title>${esc(s.label)} · ${labels[j]}: ${rp(v)}</title></rect>`});g+=`<text x="${pl+i*gw+gw/2}" y="${H-9}" text-anchor="middle" font-size="12.5" fill="${s.cur?'var(--ink)':'var(--muted)'}" font-weight="${s.cur?700:400}">${esc(s.label)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik ${labels.join(' dan ')}">${g}</svg><div class="legend">${labels.map((l,j)=>`<span><i style="background:${colors[j]}"></i>${l}</span>`).join('')}</div></div>`;
}

/* =========================================================
   COCOKKAN GUDANG ↔ PENJUALAN (pengganti buku "GUDANG PENJUALAN")
   Gudang mencatat muatan/barang keluar per sales per hari; sistem
   mencocokkan dengan nota penjualan. Selisih = penjualan belum dicatat.
   ========================================================= */
function cocok(){
  const c=C(), o={}; const k=(t,s)=>t+'|'+String(s||'').toUpperCase();
  const g=(t,s)=>o[k(t,s)]??={tanggal:t,sales:String(s||'').toUpperCase(),muat:0,muatB:0,nota:0,notaB:0,n:0,ket:[]};
  D.keluar.forEach(x=>{const r=g(x.tanggal,x.sales);r.muat+=N(x.dus);r.muatB+=N(x.bonus);if(x.keterangan)r.ket.push(x.keterangan)});
  const hari=new Set(D.keluar.map(x=>x.tanggal));
  c.inv.forEach(i=>{if(!hari.has(i.tanggal))return;const r=g(i.tanggal,i.sales);r.nota+=N(i.dus)-N(i.retur);r.notaB+=N(i.bonus);r.n++});
  return Object.values(o).map(r=>({...r,sel:(r.muat+r.muatB)-(r.nota+r.notaB)})).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||a.sales.localeCompare(b.sales));
}

/* =========================================================
   ABSENSI KARYAWAN — selfie + jam + lokasi HP; foto profil karyawan
   ========================================================= */
const JAM_MASUK=()=>C().S.jam_masuk||'08:00';
// Tempat kerja menurut jabatan (dipakai Papan Live)
function tempat(k){ const j=String(k.jabatan||'').trim().toLowerCase();
  if(k.sales===true||/sales/.test(j))return 'sales';
  if(/driver|sopir/.test(j))return 'driver';
  if(/operator/.test(j))return 'sealer';
  if(/kepala produksi/.test(j))return 'kprod';
  if(/penjamin|mutu|lab|qc/.test(j))return 'lab';
  if(/^produksi|packing|packaging|freelance|harian/.test(j))return 'packing';
  if(/gudang|^cs$|customer/.test(j))return 'gudang';
  return 'kantor'; }
function kelompok(k){ const t=tempat(k); return t==='sales'?'sales':['sealer','kprod','packing','lab'].includes(t)?'produksi':['gudang','driver'].includes(t)?'gudang':'kantor'; }
const jamNow=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const abId=(t,kid)=>'ab-'+t+'-'+kid;
const absenOf=(t,kid)=>D.absensi.find(a=>a.id===abId(t,kid));
const menit=s=>{const [h,m]=String(s||'').split(':').map(Number);return isFinite(h)?h*60+(m||0):null};
const hasSB=()=>typeof SB!=='undefined'&&!!SB;
const inisial=s=>String(s||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
function lokasi(){ return new Promise(res=>{ if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),akurasi:Math.round(p.coords.accuracy)}),()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:60000}); }); }
const normNama=x=>String(x??'').replace(/\s+/g,' ').trim().toUpperCase();
function myKaryawan(){ const n=normNama(meName()); return D.karyawan.find(k=>normNama(k.nama)===n); }
function absenBoleh(k){ if(isOwner())return true; return myKaryawan()?.id===k.id; }

/* ---- foto: pilih dari kamera, kompres di HP, unggah ke bucket privat ---- */
function pilihFoto(kamera){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*';
  if(kamera)i.setAttribute('capture',kamera); i.style.display='none';
  i.addEventListener('change',()=>{res(i.files[0]||null);i.remove()}); i.addEventListener('cancel',()=>{res(null);i.remove()});

/* ---------- ABSEN WAJAH: cek hidup (pejam mata + menoleh) lalu cocokkan sidik wajah ----------

const FACE={lib:'face/face-api.js',model:'face/model',loading:null,stream:null,stop:false,run:false,pre:false};
const wajahAktif=()=>C().S.absen_wajah!=='Tidak'&&!!navigator.mediaDevices?.getUserMedia;

const wjId=kid=>'wj-'+kid;
const wajahOf=kid=>(D.wajah||[]).find(w=>w.id===wjId(kid));
const jarakWajah=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-(b[i]||0))**2,0));
function muatSkrip(src){ return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('skrip gagal dimuat'));document.head.appendChild(s)}); }
function faceLoad(){

    await Promise.all([fa.nets.tinyFaceDetector.loadFromUri(FACE.model),fa.nets.faceLandmark68Net.loadFromUri(FACE.model),fa.nets.faceRecognitionNet.loadFromUri(FACE.model)]);
    return fa; })();

function faceStop(){ FACE.stop=true; if(FACE.stream){FACE.stream.getTracks().forEach(t=>t.stop());FACE.stream=null} }
// --- pengukuran dari 68 titik wajah
const _d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const earOf=e=>(_d(e[1],e[5])+_d(e[2],e[4]))/(2*(_d(e[0],e[3])||1));
function faceObs(dets,lebar){
  if(!dets||!dets.length)return {n:0}; if(dets.length>1)return {n:dets.length};
  const f=dets[0], lm=f.landmarks, p=lm.positions;
  const ear=(earOf(lm.getLeftEye())+earOf(lm.getRightEye()))/2;
  const l=p[36], r=p[45], hidung=p[30];
  return {n:1,ear,yaw:(hidung.x-l.x)/((r.x-l.x)||1),w:(f.detection.box.width)/(lebar||640)}; }
// --- urutan cek hidup (fungsi murni, mudah diuji)
function livenessBaru(acak=Math.random()){ return {fase:'cari',urut:acak<0.5?['kedip','toleh']:['toleh','kedip'],i:0,stabil:0,earBase:0,earN:0,tutup:false,tutupT:0,toleh:false,depan:0,mulai:null,msg:''}; }
function livenessNext(s,o,t){
  if(s.mulai==null)s.mulai=t;
  if(t-s.mulai>45000){s.fase='gagal';s.msg='Waktu habis. Cari tempat yang terang, lalu coba lagi.';return s}
  const lanjut=()=>{s.i++;s.fase=s.i<s.urut.length?s.urut[s.i]:'tatap';s.depan=0;s.tutup=false;s.toleh=false};
  if(o.n!==1){s.stabil=0;s.depan=0;s.msg=o.n?'Hanya satu wajah di depan kamera':'Arahkan wajah ke dalam bingkai';return s}
  if(o.w<0.16){s.msg='Dekatkan wajah ke kamera';return s}
  const depan=Math.abs(o.yaw-0.5)<0.1, base=s.earBase||0.28;
  if(s.fase==='cari'){ s.msg='Tahan wajah di tengah bingkai';
    if(depan&&o.ear>0.18){s.stabil++;s.earBase=(s.earBase*s.earN+o.ear)/(++s.earN)} else s.stabil=0;
    if(s.stabil>=4)s.fase=s.urut[0]; return s; }
  if(s.fase==='kedip'){ s.msg='Pejamkan mata sebentar, lalu buka';
    if(!s.tutup){ if(o.ear<Math.min(0.21,base*0.72)){s.tutup=true;s.tutupT=t} }
    else if(o.ear>base*0.82){ if(t-s.tutupT<4000)lanjut(); else s.tutup=false; }
    return s; }
  if(s.fase==='toleh'){
    if(!s.toleh){ s.msg='Tolehkan kepala pelan ke kiri atau ke kanan'; if(Math.abs(o.yaw-0.5)>0.16)s.toleh=true; }
    else { s.msg='Kembali menghadap kamera'; if(depan)lanjut(); }
    return s; }
  if(s.fase==='tatap'){ s.msg='Lihat ke kamera, jangan bergerak';
    if(depan&&o.ear>base*0.8){if(++s.depan>=3)s.fase='selesai'} else s.depan=0; return s; }
  return s; }
function faceUI(s){

  const st=$('#fcSteps'); if(!st)return;
  const nama={kedip:'Pejam mata',toleh:'Menoleh',tatap:'Cocokkan wajah'};
  const urut=[...s.urut,'tatap'], idx=s.fase==='cari'?-1:s.fase==='selesai'?urut.length:urut.indexOf(s.fase);
  st.innerHTML=urut.map((k,i)=>`<span class="fc-step ${i<idx?'ok':i===idx?'on':''}">${i<idx?'✓ ':''}${nama[k]}</span>`).join(''); }
function faceGagal(msg,k,jenis){ faceStop(); const m=$('#fcMsg'); if(m){m.textContent=msg;m.className='fc-msg bad'}
  const st=$('#fcSteps'), sx=st&&(st.querySelector('.fc-step.on')||st.lastElementChild); if(sx){sx.className='fc-step bad';sx.textContent='✕ '+sx.textContent.replace(/^✓ /,'')}

function frameCanvas(v,max=480){ const sc=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight)); const cv=document.createElement('canvas');
  cv.width=Math.round(v.videoWidth*sc); cv.height=Math.round(v.videoHeight*sc); cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height); return cv; }
function pesanKamera(e){ const n=e?.name||'';
  if(n==='NotAllowedError'||n==='SecurityError')return 'Izin kamera ditolak. Izinkan kamera untuk aplikasi ini di pengaturan browser, lalu coba lagi.';

async function faceKamera(){

// rekam wajah: cek hidup → ambil foto + sidik wajah (128 angka). Hasil null = batal/gagal (pesan sudah tampil).
async function faceRun(k,jenis){
  FACE.run=true; FACE.stop=false;
  openModal(`<div class="mh"><h3>Absen ${jenis==='masuk'?'masuk':'pulang'} · ${esc(k.nama)}</h3><button type="button" class="btn sm ghost" data-act="close" aria-label="Tutup">✕</button></div>
    <div class="mb fc-body"><div class="fc-wrap"><video id="fcVid" playsinline muted autoplay></video><div class="fc-oval"></div></div>
    <div class="fc-msg" id="fcMsg">Menyiapkan kamera dan pengenal wajah…</div><div class="fc-steps" id="fcSteps"></div>
    <p class="muted fc-note">Pertama kali butuh internet untuk mengunduh pengenal wajah (±7 MB), setelah itu tersimpan di HP.</p></div>
    <div class="mf" id="fcActs"><button class="btn" type="button" data-act="close">Batal</button></div>`);
  try{
    let fa, v;
    try{ [fa,v]=await Promise.all([faceLoad(),faceKamera()]); }catch(e){ if(e?.name!=='Batal')faceGagal(pesanKamera(e),k,jenis); return null; }
    $('.fc-note')?.remove();
    const opt=new fa.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:0.5});
    let s=null; const mSelfie=$('#fcMsg'); if(mSelfie)mSelfie.textContent='Posisikan wajah di dalam lingkaran…';

      const dets=await fa.detectAllFaces(v,opt).withFaceLandmarks();

      if(s.fase==='gagal'){faceGagal(s.msg,k,jenis);return null}

  }
  return head('Absensi','Absen masuk dan pulang dengan selfie. Bisa dari HP masing-masing atau satu HP/tablet bersama di area kerja.')+tabsH+body;

/* =========================================================
   PAPAN LIVE — orang yang sudah absen muncul di tempat kerjanya:
   cup sealer → konveyor → packaging (pallet) → gudang barang jadi,
   lab, kantor, dan peta penjualan (sales & driver)
   ========================================================= */
const lvDus=()=>N(C().S.dus_per_pallet)||70;
const lvKap=j=>N(C().S[j==='Truk'?'kap_truk':'kap_pickup'])||(j==='Truk'?900:500);
const lvJam=iso=>{ if(!iso)return ''; const d=new Date(iso); return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+'.'+String(d.getMinutes()).padStart(2,'0'); };
const lvSt={Muat:'warn',Berangkat:'hl',Kembali:'ok'};
const UP=s=>String(s||'').trim().toUpperCase();
function liveData(){
  const c=C(), t=TODAY, dpp=lvDus();
  const kar=D.karyawan.filter(k=>k.aktif!==false);
  const st=k=>{const a=absenOf(t,k.id);return !a?'belum':a.status!=='Hadir'?'izin':a.pulang?'pulang':'hadir'};
  const ada=kar.filter(k=>['hadir','pulang'].includes(st(k))).sort((a,b)=>String(absenOf(t,a.id)?.masuk||'').localeCompare(String(absenOf(t,b.id)?.masuk||'')));
  const di=z=>ada.filter(k=>tempat(k)===z);
  const prodHari=D.produksi.filter(p=>p.tanggal===t);
  const jadi=prodHari.reduce((a,p)=>a+Math.max(0,N(p.aktual)-N(p.reject)),0), rej=prodHari.reduce((a,p)=>a+N(p.reject),0);
  const stok=Math.max(0,N(c.stokNow)), pallet=Math.floor(jadi/dpp), palGud=Math.floor(stok/dpp);
  const nota=c.inv.filter(i=>i.tanggal===t);
  const muatHari=D.keluar.filter(x=>x.tanggal===t).sort((a,b)=>String(a.dibuat_pada||'').localeCompare(String(b.dibuat_pada||'')));
  const trips=muatHari.map(x=>{ const my=nota.filter(i=>UP(i.sales)===UP(x.sales)); const notaDus=my.reduce((a,i)=>a+N(i.dus),0);
    return {...x,jenis:x.kendaraan||'',kap:x.kendaraan?lvKap(x.kendaraan):0,nota:my.length,notaDus,sisa:N(x.dus)-notaDus-N(x.bonus),status:x.status||'Muat'}; });
  // posisi di peta: wilayah nota terakhir hari ini
  const wilTerakhir=nama=>{ const my=nota.filter(i=>UP(i.sales)===UP(nama)).sort((a,b)=>String(b.dibuat_pada||'').localeCompare(String(a.dibuat_pada||''))); return my[0]?.pl?.wilayah||null; };
  const lap=[...di('sales').map(k=>({k,peran:'sales',wil:st(k)==='hadir'?wilTerakhir(k.nama):null})),
    ...di('driver').map(k=>{ const tr=[...trips].reverse().find(x=>UP(x.sopir)===UP(k.nama)); return {k,peran:'driver',wil:st(k)==='hadir'&&tr&&tr.status==='Berangkat'?(wilTerakhir(tr.sales)||'_jalan'):null,tr}; })];
  const perWil={}; nota.forEach(i=>{const w=i.pl?.wilayah;if(!w)return;const r=perWil[w]??={dus:0,n:0};r.dus+=N(i.dus);r.n++});
  return {c,t,dpp,kar,st,ada,di,jadi,rej,pallet,dusSisa:jadi-pallet*dpp,stok,palGud,dusGud:stok-palGud*dpp,target:N(c.S.target_harian)||910,nota,muatHari,trips,prodHari,lap,perWil,
    belum:kar.filter(k=>st(k)==='belum'), izin:kar.filter(k=>st(k)==='izin')};
}

function lvFeed(L){
  const ev=[], t=L.t;
  D.absensi.filter(a=>a.tanggal===t).forEach(a=>{ if(a.masuk)ev.push({w:t+'T'+a.masuk+':00',ic:'🟢',tx:`${esc(a.nama)} masuk`}); if(a.pulang)ev.push({w:t+'T'+a.pulang+':00',ic:'⚪',tx:`${esc(a.nama)} pulang`}); if(a.status&&a.status!=='Hadir')ev.push({w:a.dibuat_pada||'',ic:'🟡',tx:`${esc(a.nama)} ${esc(String(a.status).toLowerCase())}${a.catatan?' — '+esc(a.catatan):''}`}); });
  L.prodHari.forEach(p=>ev.push({w:p.dibuat_pada||'',ic:'🏭',tx:`Produksi dicatat: ${nf(N(p.aktual),0)} dus, reject ${nf(N(p.reject),0)}`}));
  L.muatHari.forEach(x=>ev.push({w:x.dibuat_pada||'',ic:'🚚',tx:`${esc(x.kendaraan||'Kendaraan')} · ${esc(x.sales||'')} muat ${nf(N(x.dus),0)} dus${x.status&&x.status!=='Muat'?' · '+esc(x.status).toLowerCase():''}`}));
  L.nota.forEach(i=>ev.push({w:i.dibuat_pada||'',ic:'🧾',tx:`Nota ${esc(i.no||'')} · ${esc(i.sales||'')} · ${nf(N(i.dus),0)} dus`}));
  const jm=w=>{ if(/^\d{4}-\d\d-\d\dT\d\d:\d\d:00$/.test(w))return w.slice(11,16).replace(':','.'); return lvJam(w); };
  ev.forEach(e=>e.k=jm(e.w)); ev.sort((a,b)=>String(b.k).localeCompare(String(a.k)));
  return ev.length?`<ul class="lv2-feed">${ev.slice(0,15).map(e=>`<li><span class="mono">${esc(e.k)||'—'}</span> ${e.ic} ${e.tx}</li>`).join('')}</ul>`:'<div class="empty">Belum ada kejadian hari ini.</div>';
}

function ringkasanLiveHTML(){
  const L=liveData(), c=C(), T=TODAY, AK=c.S.akun||[];
  const pem=D.pembayaran.filter(b=>b.tanggal===T);
  const pemTunai=pem.filter(b=>b.jenis==='Penjualan tunai').reduce((a,b)=>a+N(b.nominal),0);
  const pemTagih=pem.filter(b=>b.jenis==='Penagihan piutang').reduce((a,b)=>a+N(b.nominal),0);
  const led=c.ledger.filter(r=>r.tanggal===T);
  const keluar=led.filter(r=>r.kind!=='trfOut').reduce((a,r)=>a+N(r.keluar),0);
  const setor=led.filter(r=>r.kind==='trfOut').reduce((a,r)=>a+N(r.keluar),0);
  const inv=c.inv.filter(i=>i.tanggal===T);
  const jTunai=inv.filter(i=>i.jenis==='Tunai').reduce((a,i)=>a+N(i.bersih),0);
  const jKredit=inv.filter(i=>i.jenis==='Kredit').reduce((a,i)=>a+N(i.bersih),0);
  const dusNota=inv.reduce((a,i)=>a+N(i.dus),0);
  const pct=Math.min(100,Math.round(N(L.jadi)/Math.max(1,N(L.target))*100));
  // peringatan (running text)
  const al=[];
  AK.forEach(a=>{ if((c.kasAkun[a]||0)<0) al.push(`Saldo ${a} minus ${rp(c.kasAkun[a])}`); });
  const belumNota=cocok().filter(r=>r.sel>0);
  if(belumNota.length) al.push(`${nf(belumNota.reduce((a,r)=>a+r.sel,0),0)} dus sudah dimuat gudang tapi belum ada nota (${belumNota.map(r=>r.sales).join(', ')})`);
  if(L.belum&&L.belum.length) al.push(`${L.belum.length} orang belum absen hari ini`);
  const lewat=c.piutang.filter(i=>i.lewat>0);
  if(lewat.length) al.push(`${lewat.length} piutang lewat jatuh tempo, total ${rp(lewat.reduce((a,i)=>a+N(i.sisa),0))}`);
  const lebih=c.inv.filter(i=>i.valid==='LEBIH').length;
  if(lebih) al.push(`${lebih} invoice dibayar melebihi tagihan`);
  const tanpaInv=D.pembayaran.filter(b=>b.jenis==='Penagihan piutang'&&!b.ref).length;
  if(tanpaInv) al.push(`${tanpaInv} penagihan tercatat tanpa nomor invoice`);
  const ticker=al.length?`<div class="ticker" role="status" aria-live="polite"><div class="ticker-in">${al.map(x=>'⚠ '+esc(x)).join('  ·  ')}</div></div>`:'';
  const tot=c.kasNow;
  const kasNetHari=led.reduce((a,r)=>a+N(r.masuk)-N(r.keluar),0);
  return `<div class="ph"><div><h1>Ringkasan Harian <span class="lv-live"><i></i>LANGSUNG</span></h1><p>${esc(tgl(T))} · ringkasan produksi, penjualan, dan kas hari ini</p></div></div>
  ${ticker}
  <div class="kpis" style="margin-bottom:14px">${kpi('Dus terjual',nf(dusNota,0)+' dus',nf(inv.reduce((a,i)=>a+N(i.bonus),0),0)+' dus bonus','hl')}${kpi('Total pemasukan',rp(pemTunai+pemTagih),'tunai '+rp(pemTunai)+' · penagihan '+rp(pemTagih))}${kpi('Kas hari ini',rp(kasNetHari),'saldo akhir semua akun '+rp(tot))}</div>
  <div class="card" style="margin-bottom:14px"><h2>Produksi</h2><div class="kpis">${kpi('Produksi hari ini',nf(L.jadi,0)+' dus',pct+'% dari target '+nf(L.target,0),'hl')}${kpi('Gudang barang jadi',nf(L.stok,0)+' dus',(L.palGud||0)+' pallet')}${kpi('Muatan hari ini',nf(L.muatHari.reduce((a,x)=>a+N(x.dus),0),0)+' dus',L.trips.length+' perjalanan')}</div></div>
  <div class="card" style="margin-bottom:14px"><h2>Penjualan</h2><div class="kpis">${kpi('Nota',String(inv.length),nf(dusNota,0)+' dus','hl')}${kpi('Penjualan tunai',rp(jTunai))}${kpi('Penjualan kredit',rp(jKredit))}${kpi('Total penjualan',rp(jTunai+jKredit))}</div></div>
  <div class="card" style="margin-bottom:14px"><h2>Kas hari ini</h2><div class="kpis">${kpi('Pemasukan tunai',rp(pemTunai))}${kpi('Penagihan masuk',rp(pemTagih))}${kpi('Pengeluaran',rp(keluar))}${kpi('Setor ke bank',rp(setor))}${kpi('Saldo kas semua akun',rp(tot),AK.map(a=>a+' '+rp(c.kasAkun[a]||0)).join(' · '))}</div></div>`;
}

const PULANG_OTO_JAM='16:30', PULANG_OTO_DONE=new Set();
function pulangOtomatisCek(){
  try{
    const jam=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false});
    if(jam<PULANG_OTO_JAM) return;
    D.absensi.filter(a=>a.tanggal===TODAY&&a.masuk&&!a.pulang&&!PULANG_OTO_DONE.has(a.id)).forEach(a=>{
      PULANG_OTO_DONE.add(a.id);

    });
  }catch(e){}
}

V.kas=()=>{

    const ak=F.a_ks||''; const sub=ak?all.filter(r=>r.akun===ak):all; const rows=sub.filter(r=>inM(r.tanggal,m));
    const before=sub.filter(r=>r.tanggal<m+'-01'); const sa=ak?(c.saldoAwal[ak]||0):Object.values(c.saldoAwal).reduce((a,b)=>a+b,0);

function bahanBulan(m){const c=C();const s0=c.S.tgl_stok_awal||'0000-00-00';const st=m+'-01';const net=e=>e.masuk+e.koreksi-e.pakai-e.rijek;
  return c.bahan.map(b=>{const ev=c.bEv.filter(e=>e.bahan===b.id);
    // saldo_awal = saldo fisik pada tgl_stok_awal; bulan sebelumnya dihitung mundur dari saldo itu
    const bal=d=>{let v=N(b.saldo_awal);if(d>=s0)ev.forEach(e=>{if(e.tanggal>=s0&&e.tanggal<d)v+=net(e)});else ev.forEach(e=>{if(e.tanggal>=d&&e.tanggal<s0)v-=net(e)});return v};
    let masuk=0,pakai=0,rijek=0,kor=0;ev.forEach(e=>{if(inM(e.tanggal,m)){masuk+=e.masuk;pakai+=e.pakai;rijek+=e.rijek;kor+=e.koreksi}});
    const awal=bal(st);return {...b,awal,masuk,pakai,rijek,kor,akhir:awal+masuk+kor-pakai-rijek}})}

/* kriteria halal per bahan (SPJH), dibaca dari master bahan; data lama tidak diubah */
function halalLv(b){
  if(!b) return {lv:'bad',t:'Bahan tidak ditemukan'};
  if(b.status_halal===HALAL_STATUS[1]) return {lv:'ok',t:'Dikecualikan'};
  const adaNo=!!String(b.no_sh||'').trim();
  if(!b.status_halal && !adaNo) return {lv:'bad',t:'Belum dicek'};
  if(b.tgl_sh_berlaku){const h=hariKe(b.tgl_sh_berlaku); if(h<0) return {lv:'bad',t:'SH kedaluwarsa'}; if(h<=60) return {lv:'warn',t:'SH segera habis'};}
  if(b.status_halal===HALAL_STATUS[2]) return {lv:'warn',t:'Perlu persetujuan BPJPH'};
  if(!adaNo) return {lv:'warn',t:'Belum ada no. SH'};
  return {lv:'ok',t:'SH berlaku'};
}
const halalChip=b=>{const x=halalLv(b);return chip(x.t,x.lv)};

function ctRentang(){
  const t=new Date(TODAY+'T00:00:00');
  if(F.ct_rentang==='enam'){
    const f=new Date(t.getFullYear(),t.getMonth()-5,1);
    const dari=`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-01`;
    return {ok:d=>!!d&&d>=dari&&d<=TODAY, teks:`${tgl(dari)} s/d ${tgl(TODAY)}`, kunci:'6-bulan-'+TODAY};
  }
  const m=F.m_ct||TODAY.slice(0,7);
  const nm=new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  return {ok:d=>!!d&&d.slice(0,7)===m, teks:'Bulan '+nm, kunci:m};
}
function ctData(jenis){
  const c=C(), R=ctRentang(), pj='Badrus Ali';
  const prod=(D.produk[0]?.nama)||'CN Air Mineral Gelas ukuran 220ml';
  const semuaOk=(c.bahan||[]).every(b=>halalLv(b).lv==='ok');
  const tidakOk=(c.bahan||[]).filter(b=>halalLv(b).lv!=='ok').map(b=>b.nama);
  const kesProduk=semuaOk?'Sesuai':'Tidak sesuai';
  const ketProduk=semuaOk?'Semua bahan pembentuk bersertifikat dan berlaku':'Perlu dicek: '+tidakOk.join(', ');
  const items=[];
  if(['pembelian','pemeriksaan','penyimpanan_bahan'].includes(jenis)){
    (c.sup||[]).filter(s=>R.ok(s.tanggal)).forEach(s=>(s.items||[]).forEach(i=>{
      const b=c.bah[i.bahan]||{}, hl=halalLv(b);
      const okLine=(s.halal_cek&&hl.lv==='ok')?'Sesuai':'Tidak sesuai / belum dicek';
      const row=jenis==='pembelian'
        ?[tgl(s.tanggal),b.nama||'',b.merk||'',b.produsen||'',`${nf(i.qty)} ${b.satuan||''}`,pj,hl.t]
        :jenis==='pemeriksaan'
          ?[tgl(s.tanggal),b.nama||'',b.merk||'',b.produsen||'',b.negara||'',okLine]
          :[tgl(s.tanggal),b.nama||'',b.merk||'',b.produsen||'',okLine,b.no_sh?'Sertifikat halal '+b.no_sh:(b.status_halal||'Belum diisi')];
      items.push({t:s.tanggal,row});
    }));
  }
  if(jenis==='produksi') (D.produksi||[]).filter(r=>R.ok(r.tanggal)).forEach(r=>items.push({t:r.tanggal,row:[tgl(r.tanggal),r.produk||prod,nf(Math.max(0,N(r.aktual)-N(r.reject))),kodeBatch(r),r.exp?tgl(r.exp):'–',kesProduk]}));
  if(jenis==='penyimpanan_produk') (D.produksi||[]).filter(r=>R.ok(r.tanggal)).forEach(r=>items.push({t:r.tanggal,row:[tgl(r.tanggal),r.produk||prod,kesProduk,ketProduk]}));
  if(jenis==='distribusi') (D.penjualan||[]).filter(r=>R.ok(r.tanggal)&&N(r.dus)>0).forEach(r=>{
    const pel=(D.pelanggan||[]).find(p=>p.id===r.pelanggan);
    items.push({t:r.tanggal,row:[tgl(r.tanggal),prod,`${nf(r.dus)} dus`,pel?.nama||'Tunai umum',kesProduk]}); });
  items.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  const rows=items.map(x=>x.row);
  const info=CT_LIST.find(x=>x[0]===jenis)||CT_LIST[0];
  const ringkas=[`Jumlah catatan: ${rows.length}`];
  if(['produksi','penyimpanan_produk','distribusi'].includes(jenis)) ringkas.push(`Kriteria halal bahan pembentuk produk: ${semuaOk?'semua sesuai':'ada yang perlu dicek'}`);
  return {file:`${info[3]}-${R.kunci}`.replace(/[^\w-]+/g,'-'), judul:info[3], docNo:'-', periode:R.teks, lampiran:info[2], headers:CT_HEAD[jenis], widths:CT_LEBAR[jenis], rows, ringkas, ttd:CT_TTD, tanggal:TODAY};
}
async function unduhCatatan(jenis){
  try{

}

function nomorUndanganBaru(tgl){
  const d=(tgl||TODAY).split('-').map(Number), y=d[0], m=d[1];
  const rom=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][m-1];

function fieldHTML(f,v){
  const id='f_'+f.k, req=f.req?' required':'', ro=f.ro?' disabled':'';
  if(f.type==='html')return `<div class="${f.full!==false?'full':''}" id="${id}">${f.html||''}</div>`;

  let inp;
  if(f.type==='search'){const lab=(f.options||[]).map(o=>Array.isArray(o)?o:[o,o]).find(o=>String(o[0])===String(v??''))?.[1]||''; const dl=(f.options||[]).map(o=>{const [val,lb]=Array.isArray(o)?o:[o,o];return `<option value="${esc(lb)}"></option>`}).join(''); return `<div class="field ${f.full?'full':''}" data-k="${f.k}"><label for="${id}_t">${esc(f.label)}</label><input id="${id}_t" type="text" list="${id}_dl" autocomplete="off" data-search="${f.k}" value="${esc(lab)}" placeholder="${esc(f.ph||'Ketik nama pelanggan…')}"${req}><datalist id="${id}_dl">${dl}</datalist><input type="hidden" name="${f.k}" value="${esc(v??'')}"><small id="h_${f.k}" class="hint"></small>${f.hint?`<small class="hint">${esc(f.hint)}</small>`:''}</div>`;}

  else if(f.type==='upload')inp=`<div class="upl"><input type="file" accept="image/*,application/pdf" data-upload="${f.k}"><input type="hidden" name="${f.k}" value="${esc(v??'')}"><small id="h_${f.k}" class="hint">${v?'✓ Foto nota tersimpan di server':'Foto nota atau PDF (opsional). Akan disimpan di server.'}</small></div>`;

  else { const isN=f.type==='money'||f.type==='number'; inp=`<input id="${id}" name="${f.k}" type="${isN?'number':f.type||'text'}" ${f.type==='money'?'step="1" inputmode="numeric"':''} ${f.type==='number'?`step="${f.step||'any'}" inputmode="decimal"`:''} ${isN&&f.min!==null?`min="${f.min??0}"`:''} value="${esc(v??'')}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}${req}${ro}>`; }
  return `<div class="field ${f.full?'full':''}" data-k="${f.k}" ${f.hidden?'hidden':''}>${f.type==='check'?'':`<label for="${id}">${esc(f.label)}${f.req?' <b class="req">*</b>':''}</label>`}${inp}<div class="hint" id="h_${f.k}">${f.hint||''}</div></div>`;
}

const UJI_TAHAP={baku:'Air baku',proses:'Air setengah jadi'};
// Acuan: Rencana Mutu (Lamp.04.03). Air baku & air setengah jadi: TDS maks 1500 mg/L, pH 6,5–9,0.
const STANDAR_TAHAP={baku:{tds:1500,pmin:6.5,pmax:9},proses:{tds:1500,pmin:6.5,pmax:9}};
const ORG_OPT={bau:['Tidak berbau','Berbau'],rasa:['Tidak berasa','Berasa'],warna:['Tidak berwarna','Berwarna']};
const orgOk=x=>(x.bau||x.rasa||x.warna)?(x.bau!=='Berbau'&&x.rasa!=='Berasa'&&x.warna!=='Berwarna'):x.organoleptik!=='Tidak sesuai';
const orgDerive=x=>orgOk(x)?'Sesuai':'Tidak sesuai';
const fieldsOrg=()=>[{k:'s2',type:'sep',label:'Bau, rasa, warna (Rencana Mutu)'},{k:'bau',label:'Bau',type:'select',options:ORG_OPT.bau,ph:false},{k:'rasa',label:'Rasa',type:'select',options:ORG_OPT.rasa,ph:false},{k:'warna',label:'Warna',type:'select',options:ORG_OPT.warna,ph:false,hint:'Jika ada yang berbau, berasa, atau berwarna, hasil tidak memenuhi.'}];
const valOrg=x=>({bau:x?.bau||'Tidak berbau',rasa:x?.rasa||'Tidak berasa',warna:x?.warna||'Tidak berwarna'});
const ujiAirHasil=r=>{ if(r.tds===''||r.tds==null||r.ph===''||r.ph==null) return {k:'belum',t:'Belum diuji',c:''};
  const S=C().S; const st=STANDAR_TAHAP[r.tahap]||{tds:N(S.tds_max)||500,pmin:(S.ph_min!==''&&S.ph_min!=null)?N(S.ph_min):6.5,pmax:(S.ph_max!==''&&S.ph_max!=null)?N(S.ph_max):8.5};
  const ok=N(r.tds)<=st.tds && N(r.ph)>=st.pmin && N(r.ph)<=st.pmax && orgOk(r);
  return ok?{k:'lulus',t:'Memenuhi',c:'ok'}:{k:'tidak',t:'Tidak memenuhi',c:'bad'}; };
function formUjiAir(tahap,rec){
  const st=STANDAR_TAHAP[tahap];
  const v={tanggal:TODAY,jam:lvJam(new Date().toISOString()),...(rec||{}),...valOrg(rec),tahap};
  openForm({title:(rec?'Ubah ':'Uji QC ')+UJI_TAHAP[tahap],values:v,
    fields:[{k:'tanggal',label:'Tanggal',type:'date',req:1},{k:'jam',label:'Jam sampel',type:'text',ph:'mis. 07.30'},{k:'s1',type:'sep',label:'Hasil uji (standar Rencana Mutu Lamp.04.03)'},{k:'tds',label:'TDS (mg/L)',type:'number',step:0.1,req:1,hint:'Standar maks. '+st.tds+' mg/L'},{k:'ph',label:'pH',type:'number',step:0.1,req:1,hint:'Standar '+String(st.pmin).replace('.',',')+' – '+String(st.pmax).replace('.',',')},...fieldsOrg(),{k:'catatan',label:'Catatan',type:'text',full:1},{k:'ringkas',type:'html'}],
    onChange(x,api){ const h=ujiAirHasil({...x,tahap}); api.html('ringkas',`<div class="sum"><div class="r big"><span>Hasil</span><b class="${h.c==='ok'?'okt':h.c==='bad'?'badt':'warnt'}">${h.t}</b></div></div>`); },
    async onSubmit(x){ if(x.tds===''||x.tds==null||N(x.tds)<0)return 'Isi TDS dengan benar.'; if(x.ph===''||x.ph==null)return 'Isi pH.';
      await put('uji_air',stamp({id:rec?.id,tahap,...x,tds:N(x.tds),ph:N(x.ph),organoleptik:orgDerive(x)},rec)); },okMsg:UJI_TAHAP[tahap]+' tersimpan'});

function csvHal(){
  const tbs=[...document.querySelectorAll('#app table')];
  if(!tbs.length){toast('Tidak ada tabel di halaman ini');return}
  const q=v=>{v=String(v??'').replace(/\s+/g,' ').trim(); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  let out='\uFEFF';
  tbs.forEach((tb,i)=>{ if(i) out+='\r\n';
    [...tb.rows].forEach(tr=>{ const cells=[...tr.cells].filter(c=>!c.querySelector('button')); out+=cells.map(c=>q(c.innerText)).join(';')+'\r\n'; }); });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'text/csv;charset=utf-8'}));
  a.download=`${ROUTE||'data'}-${TODAY}.csv`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

const nextMonth=k=>{let [y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
function monthsRange(a,b){const o=[];let k=a;while(k<=b&&o.length<240){o.push(k);k=nextMonth(k)}return o}
const pct=(a,b,d=1)=>b?nf(a/b*100,d)+'%':'–';
const chg=(a,b,inv=false)=>{if(!b)return '<span class="muted">–</span>';const v=(a-b)/Math.abs(b)*100;const good=inv?v<=0:v>=0;return `<span class="${good?'okt':'badt'}">${v>=0?'+':''}${nf(v,1)}%</span>`};
function saldoAt(d){const c=C();const s={...c.saldoAwal};c.ledger.forEach(r=>{if(r.tanggal<=d)s[r.akun]=(s[r.akun]||0)+r.masuk-r.keluar});return s}
const sumV=o=>Object.values(o).reduce((a,b)=>a+b,0);
const KIND_LBL={tunai:'Penjualan tunai',kredit:'Penagihan piutang',lain:'Modal & penerimaan lain',pinjaman:'Pinjaman masuk',ops:'Pengeluaran operasional',beli:'Pembelian bahan tunai',gaji:'Gaji karyawan',hutang:'Bayar hutang (pokok + bunga)'};

function kasKind(inP){const r={};C().ledger.forEach(l=>{if(!inP(l.tanggal)||l.kind==='trfIn'||l.kind==='trfOut')return;r[l.kind]=(r[l.kind]||0)+l.masuk+l.keluar});return r}
function salesStat(inP){
  const c=C(),o={}; const g=k=>o[k]??={sales:k,n:0,dus:0,bonus:0,pj:0,tunai:0,kredit:0,tagih:0,piut:0,p90:0,pel:new Set()};
  c.inv.forEach(i=>{if(!inP(i.tanggal))return;const s=g(i.sales||'–');s.n++;s.dus+=N(i.dus)-N(i.retur);s.bonus+=N(i.bonus);s.pj+=i.bersih;i.jenis==='Tunai'?s.tunai+=i.bersih:s.kredit+=i.bersih;if(i.pelanggan)s.pel.add(i.pelanggan)});
  D.pembayaran.forEach(b=>{if(b.jenis!=='Penagihan piutang'||!inP(b.tanggal))return;g(c.invByNo[b.ref]?.sales||'–').tagih+=N(b.nominal)});
  c.piutang.forEach(i=>{const s=o[i.sales||'–'];if(!s)return;s.piut+=i.sisa;if(i.lewat>90)s.p90+=i.sisa});
  return Object.values(o).filter(s=>s.n||s.tagih).sort((a,b)=>b.pj-a.pj);
}
function wilStat(inP){const c=C(),o={};c.inv.forEach(i=>{if(!inP(i.tanggal))return;const k=i.w?.id||'-';const s=o[k]??={nama:i.wilNama||'Tanpa wilayah / tunai umum',zona:i.zona,n:0,dus:0,pj:0,pel:new Set(),piut:0};s.n++;s.dus+=N(i.dus)-N(i.retur);s.pj+=i.bersih;if(i.pelanggan)s.pel.add(i.pelanggan)});c.piutang.forEach(i=>{const s=o[i.w?.id||'-'];if(s)s.piut+=i.sisa});return Object.values(o).sort((a,b)=>b.pj-a.pj)}
function zonaStat(inP){const o={DK:{z:'DK — Dalam Kota',dus:0,pj:0,n:0},LK:{z:'LK — Luar Kota',dus:0,pj:0,n:0},'':{z:'Tanpa zona / tunai umum',dus:0,pj:0,n:0}};C().inv.forEach(i=>{if(!inP(i.tanggal))return;const s=o[i.zona||'']||o[''];s.n++;s.dus+=N(i.dus)-N(i.retur);s.pj+=i.bersih});return Object.values(o).filter(s=>s.n)}
function pelStat(inP){const c=C(),o={};c.inv.forEach(i=>{if(!inP(i.tanggal)||!i.pelanggan)return;const s=o[i.pelanggan]??={nama:i.pelNama,wil:i.wilNama,zona:i.zona,sales:i.sales,n:0,dus:0,pj:0,last:''};s.n++;s.dus+=N(i.dus)-N(i.retur);s.pj+=i.bersih;if(i.tanggal>s.last)s.last=i.tanggal});Object.entries(o).forEach(([k,s])=>s.piut=c.piutangPel[k]||0);return Object.values(o).sort((a,b)=>b.pj-a.pj)}
function aging(){const c=C();return [['Belum jatuh tempo',i=>!i.lewat],['Lewat 1–30 hari',i=>i.lewat>0&&i.lewat<=30],['Lewat 31–60 hari',i=>i.lewat>30&&i.lewat<=60],['Lewat 61–90 hari',i=>i.lewat>60&&i.lewat<=90],['Lewat > 90 hari',i=>i.lewat>90]].map(([l,f])=>{const r=c.piutang.filter(f);return {l,n:r.length,v:r.reduce((a,i)=>a+i.sisa,0)}})}
function prodStat(inP){const rows=D.produksi.filter(p=>inP(p.tanggal));const r={hari:new Set(rows.map(p=>p.tanggal)).size,target:0,aktual:0,reject:0,kend:{}};rows.forEach(p=>{r.target+=N(p.target);r.aktual+=N(p.aktual);r.reject+=N(p.reject);const k=p.kendala||'Normal';r.kend[k]=(r.kend[k]||0)+1});r.terima=Math.max(0,r.aktual-r.reject);return r}

function bahanRange(ms){const c=C();const per=ms.map(bahanBulan);return c.bahan.map((b,j)=>{const r={nama:b.nama,satuan:b.satuan,awal:per[0][j].awal,akhir:per[per.length-1][j].akhir,masuk:0,pakai:0,rijek:0,kor:0,harga:c.hargaBahan(b.id),per_dus:N(b.per_dus)};per.forEach(p=>{r.masuk+=p[j].masuk;r.pakai+=p[j].pakai;r.rijek+=p[j].rijek;r.kor+=p[j].kor});return r})}
function gajiStat(inP){const c=C(),jab={},bln={};let n=new Set(),tot=0,belum=0,nb=0;D.gaji.forEach(g=>{if(!inP(g.tanggal))return;const v=gajiBersih(g);const j=g.jabatan||c.kar[g.karyawan]?.jabatan||'Lainnya';const s=jab[j]??={jabatan:j,org:new Set(),slip:0,v:0};s.org.add(g.karyawan||g.nama);s.slip++;s.v+=v;n.add(g.karyawan||g.nama);tot+=v;if(g.status!=='Dibayar'){belum+=v;nb++}const m=(g.tanggal||'').slice(0,7);bln[m]=(bln[m]||0)+v});return {jab:Object.values(jab).sort((a,b)=>b.v-a.v),org:n.size,tot,belum,nb,bln}}
function biayaStat(inP){const o={};let prive=0;D.pengeluaran.forEach(e=>{if(!inP(e.tanggal)||L.kategoriTerkunci.includes(e.kategori))return;if(L.kategoriNonLaba.includes(e.kategori)){prive+=N(e.nominal);return}const k=e.kategori||'Lainnya';o[k]=(o[k]||0)+N(e.nominal)});return {rows:Object.entries(o).sort((a,b)=>b[1]-a[1]),prive}}

  ${sec(4,'Divisi Penjualan',`${tbl([{h:'Sales',f:s=>esc(s.sales)},{h:'Invoice',c:'num',f:s=>s.n},{h:'Dus',c:'num',f:s=>nf(s.dus,0)},{h:'Bonus',c:'num',f:s=>nf(s.bonus,0)},{h:'Penjualan',c:'num',f:s=>rp(s.pj)},{h:'Porsi',c:'num',f:s=>pct(s.pj,b.pj,0)},{h:'Tunai',c:'num',f:s=>rpS(s.tunai)},{h:'Kredit',c:'num',f:s=>rpS(s.kredit)},{h:'Tertagih',c:'num',f:s=>rpS(s.tagih)},{h:'Sisa piutang*',c:'num',f:s=>rpS(s.piut)}],ss,{foot:['Total',ss.reduce((a,s)=>a+s.n,0),nf(b.dus,0),nf(b.bonus,0),rp(b.pj),'',rpS(b.tunai),rpS(b.kredit),rpS(ss.reduce((a,s)=>a+s.tagih,0)),rpS(ss.reduce((a,s)=>a+s.piut,0))]})}
    <div class="grid g2" style="margin-top:10px"><div>${tbl([{h:'Zona',f:s=>s.z},{h:'Dus',c:'num',f:s=>nf(s.dus,0)},{h:'Penjualan',c:'num',f:s=>rp(s.pj)},{h:'Rata/dus',c:'num',f:s=>s.dus?rp(s.pj/s.dus):'–'}],zs)}<div style="height:10px"></div>${tbl([{h:'Wilayah teratas',f:s=>esc(s.nama)+zone(s.zona)},{h:'Dus',c:'num',f:s=>nf(s.dus,0)},{h:'Penjualan',c:'num',f:s=>rpS(s.pj)}],ws.slice(0,8))}</div>
    <div>${tbl([{h:'10 pelanggan terbesar',f:p=>esc(p.nama)+`<span class="sub">${esc(p.wil||'')} · ${esc(p.sales||'')}</span>`},{h:'Dus',c:'num',f:p=>nf(p.dus,0)},{h:'Penjualan',c:'num',f:p=>rpS(p.pj)},{h:'Piutang*',c:'num',f:p=>p.piut?rpS(p.piut):'–'}],ps,{empty:'Belum ada penjualan ke pelanggan terdaftar.'})}</div></div>`)}

/* ---------- LAPORAN MENYELURUH ---------- */
function repMenyeluruh(a,z){
  const c=C(); if(a>z)[a,z]=[z,a]; const ms=monthsRange(a,z), inP=d=>!!d&&d.slice(0,7)>=a&&d.slice(0,7)<=z;
  const rows=ms.map(m=>{const b=bulan(m),h=hpp(m),pr=prodStat(d=>inM(d,m));return {m,b,h,pr,sal:sumV(saldoAt(eomOf(m)))}});
  const T=rows.reduce((t,r)=>{['pj','dus','bonus','kasPel','masuk','keluar','ops','gaji','bunga','prive','tunai','kredit','prod','reject','bayarHutang','belanjaBahan'].forEach(k=>t[k]=(t[k]||0)+r.b[k]);t.laba=(t.laba||0)+r.h.laba;t.lk=(t.lk||0)+r.h.labaKotor;t.hppJ=(t.hppJ||0)+r.h.hppJual+r.h.biayaBonus;t.opsNK=(t.opsNK||0)+r.h.opsNonKont;t.prodBiaya=(t.prodBiaya||0)+r.h.totProd;return t},{});
  const nM=rows.length, aktif=rows.filter(r=>r.b.pj>0), nA=aktif.length||1;
  const ss=salesStat(inP), ws=wilStat(inP), zs=zonaStat(inP), pls=pelStat(inP), ag=aging(), totP=ag.reduce((x,y)=>x+y.v,0);
  const pr=prodStat(inP), sj=stokJadi(inP), mt=mutasiStat(inP), bh=bahanRange(ms), gs=gajiStat(inP), bs=biayaStat(inP);
  const utang=c.utang.filter(u=>u.sisa>0), totU=utang.reduce((x,u)=>x+u.sisa,0);
  const hppAvg=T.prod?T.prodBiaya/T.prod:hpp(z).std, hargaAvg=T.dus?T.pj/T.dus:0, margAvg=hargaAvg-hppAvg;
  const fixAvg=(T.opsNK+T.gaji+T.bunga)/nA, dusAvg=T.dus/nA, bep=margAvg>0?fixAvg/margAvg:null, hargaBep=dusAvg?hppAvg+fixAvg/dusAvg:null;
  const best=[...aktif].sort((x,y)=>y.h.laba-x.h.laba)[0], worst=[...aktif].sort((x,y)=>x.h.laba-y.h.laba)[0];
  const f0=aktif[0], f1=aktif[aktif.length-1];
  const top5=pls.slice(0,5).reduce((x,p)=>x+p.pj,0), named=pls.reduce((x,p)=>x+p.pj,0);
  const days=Math.max(1,dBetween(a+'-01',eomOf(z))+1), dso=T.kredit?totP/(T.kredit/days):null;
  const kor=mt.find(x=>x.jenis==='Koreksi'), korNet=kor?kor.masuk-kor.keluar:0;
  const rijekV=bh.reduce((x,r)=>x+r.rijek*r.harga,0), korBV=bh.reduce((x,r)=>x+r.kor*r.harga,0);
  const rejR=rows.filter(r=>r.pr.aktual).map(r=>({m:r.m,v:r.pr.reject/r.pr.aktual})), rejMax=[...rejR].sort((x,y)=>y.v-x.v)[0];
  const ins=[];
  ins.push({lv:T.laba>=0?'ok':'bad',judul:`Total estimasi laba bersih ${rp(T.laba)} dalam ${nM} bulan (rata-rata ${rp(T.laba/nA)}/bulan aktif)`,isi:best?`Terbaik ${ymL(best.m)} ${rp(best.h.laba)}; terendah ${ymL(worst.m)} ${rp(worst.h.laba)}.`:''});
  ins.push({lv:margAvg>2000?'ok':'warn',judul:`Margin kotor rata-rata ${rp(margAvg)}/dus`,isi:`Harga jual rata-rata ${rp(hargaAvg)} − HPP rata-rata ${rp(hppAvg)}.${f0&&f1&&f0!==f1?` Margin ${ymL(f0.m)} ${rp(f0.b.dus?f0.b.pj/f0.b.dus-f0.h.pakaiPerDus:0)} → ${ymL(f1.m)} ${rp(f1.b.dus?f1.b.pj/f1.b.dus-f1.h.pakaiPerDus:0)}.`:''} Kenaikan harga bahan baku perlu segera diikuti penyesuaian harga jual.`});
  if(bep)ins.push({lv:dusAvg>=bep*1.2?'ok':dusAvg>=bep?'warn':'bad',judul:`Titik impas sekitar ${nf(bep,0)} dus/bulan; rata-rata terjual ${nf(dusAvg,0)} dus/bulan`,isi:`Biaya tetap rata-rata (operasional non-kontainer + gaji + bunga) ${rp(fixAvg)}/bulan. Pada volume rata-rata, harga impas ≈ ${rp(hargaBep)}/dus.`});
  ins.push({lv:ag[4].v/(totP||1)>0.2?'bad':ag[4].v?'warn':'ok',judul:`Piutang beredar ${rp(totP)}; ${pct(ag[4].v,totP,0)} sudah lewat 90 hari`,isi:dso?`Rata-rata uang tertahan di pelanggan ±${nf(dso,0)} hari (dihitung dari penjualan kredit periode ini). Pertimbangkan batas kredit per toko dan target penagihan per sales.`:''});
  if(named)ins.push({lv:top5/named>0.4?'warn':'ok',judul:`5 pelanggan terbesar menyumbang ${pct(top5,named,0)} penjualan ke pelanggan terdaftar`,isi:`${pls.slice(0,5).map(p=>esc(p.nama)).join(', ')}.${top5/named>0.4?' Ketergantungan cukup tinggi — perluas basis pelanggan.':''}`});

V.laporan=()=>{
  const t=curTab('lap','bulanan'); const tm=TODAY.slice(0,7);
  const dates=[...D.penjualan,...D.produksi,...D.pengeluaran,...D.gaji].map(r=>r.tanggal).filter(Boolean);
  const S=C().S; const k0=(S.tgl_mulai_kas||'2026-01').slice(0,7);
  const months=[...new Set(dates.map(d=>d.slice(0,7)).filter(m=>m>=k0&&m<=tm))].sort().reverse(); if(!months.includes(tm))months.unshift(tm);
  if(F.m_lap==null)F.m_lap=months.includes(prevMonth(tm))?prevMonth(tm):months[0];
  if(F.lap_a==null)F.lap_a=months[months.length-1]; if(F.lap_z==null)F.lap_z=months.includes(prevMonth(tm))?prevMonth(tm):months[0];
  const opt=months.map(m=>[m,ymL(m)]);
  const or=F.lap_or||(t==='menyeluruh'?'landscape':'portrait');
  const flt=t==='bulanan'?selF('m_lap','Bulan',opt):selF('lap_a','Dari',opt)+selF('lap_z','Sampai',opt);
  let body; try{body=t==='bulanan'?repBulanan(F.m_lap):repMenyeluruh(F.lap_a,F.lap_z)}catch(e){console.error(e);body=`<div class="note warn">Laporan gagal disusun: ${esc(e.message)}</div>`}
  return `<div class="noprint">${head('Laporan & Cetak','Laporan bulanan untuk owner dan laporan menyeluruh semua divisi sebagai bahan evaluasi. Tekan Cetak lalu pilih printer atau “Simpan sebagai PDF”.',`<button class="btn pri" data-act="cetak">Cetak / Simpan PDF</button>`)}
  ${tabs('lap',[['bulanan','Laporan bulanan owner'],['menyeluruh','Laporan menyeluruh semua divisi']])}
  <div class="filters">${flt}${selF('lap_or','Kertas',[['portrait','A4 potret'],['landscape','A4 lanskap']],or)}</div></div>
  <style>@media print{@page{size:A4 ${F.lap_or||or};margin:12mm 11mm}}</style>${body}`;
};

function loginView(){
  const sn=salesNames();
  return `<div class="login"><div class="lbox"><div class="lhead">${LOGO}<div><h1>CN Air Mineral</h1><p>Sistem Informasi CV QQ Eka Putra · prototipe</p></div></div>
  <div class="card" style="box-shadow:var(--shadow)"><h2>Masuk sebagai</h2><div class="roles">
   ${[['owner','Owner','Ringkasan, laporan, keuangan, master data — semua menu.'],['sales','Sales','Input penjualan, penagihan, dan piutang toko sendiri dari HP.'],['gudang','Gudang','Stok barang jadi, mutasi, stock opname, penerimaan bahan.'],['produksi','Produksi','Catat produksi harian dan pemakaian bahan baku.']].map(([k,t,s])=>`<button class="role ${loginRole===k?'on':''}" data-act="pickRole" data-role="${k}"><b>${t}</b><span>${s}</span></button>`).join('')}
  </div>${loginRole==='owner'?ownerLoginHTML():''}${loginRole==='sales'?`<div style="margin-top:14px"><h2>Pilih nama sales</h2>${!ready()?'<p class="muted">Memuat daftar sales…</p>':sn.length?`<div class="names">${sn.map(n=>`<button class="btn" data-act="pickSales" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:'<p class="muted">Belum ada karyawan dengan jabatan Sales. Owner perlu menambahkannya di Master Data → Karyawan.</p>'}</div>`:''}
  <p class="muted" style="font-size:12.5px;margin:14px 0 0">Owner memakai password. Peran lain cukup memilih nama. Pilihan peran tersimpan di perangkat ini — tekan “Ganti” di menu untuk keluar.</p></div></div></div>`;
}
function ownerLoginHTML(){
  if(!ready())return '<p class="muted" style="margin-top:14px">Memuat…</p>';
  const od=ownerDoc();
  if(od)return `<form id="oform" data-mode="login" style="margin-top:14px;display:grid;gap:8px;max-width:360px"><h2>Kata sandi owner</h2><input type="password" id="opw" autocomplete="current-password" placeholder="Masukkan password" aria-label="Kata sandi owner"><span class="badt" id="oerr"></span><button class="btn pri" type="submit">Masuk</button></form>`;
  return `<form id="oform" data-mode="create" style="margin-top:14px;display:grid;gap:8px;max-width:360px"><h2>Buat password owner</h2><p class="muted" style="margin:0;font-size:12.5px">Belum ada password. Hanya akun pemilik aplikasi ini yang bisa membuatnya.</p><input type="password" id="opw1" autocomplete="new-password" placeholder="Kata sandi baru (min. 6 karakter)" aria-label="Kata sandi baru"><input type="password" id="opw2" autocomplete="new-password" placeholder="Ulangi password" aria-label="Ulangi password"><span class="badt" id="oerr"></span><button class="btn pri" type="submit">Simpan & masuk</button></form>`;
}
async function ownerSubmit(form){
  const err=t=>{const e=$('#oerr');if(e)e.textContent=t};
  try{
    if(form.dataset.mode==='login'){const od=ownerDoc();const h=await sha(od.salt+':'+$('#opw').value);if(h!==od.hash)return err('Kata sandi salah.');setTok(h);setMe({role:'owner',name:'Owner'});ROUTE=null;render();return}
    const a=$('#opw1').value,b=$('#opw2').value; if(a.length<6)return err('Kata sandi minimal 6 karakter.'); if(a!==b)return err('Ulangan password tidak sama.');
    const salt=genId(); const h=await sha(salt+':'+a);

async function scanKamera(tujuan=null){
  SCAN_TUJUAN=tujuan; SCAN_MSG='';
  const adaDet='BarcodeDetector' in window, adaJs=typeof jsQR==='function';
  if(!adaDet&&!adaJs){SCAN_MSG='Pemindai QR belum termuat. Muat ulang halaman, atau ketik kodenya.'; render(); return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){SCAN_MSG='Kamera hanya bisa dibuka lewat HTTPS. Ketik kodenya saja.'; render(); return}
  try{ SCAN_STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ SCAN_MSG='Kamera tidak bisa dibuka: '+e.message; render(); return }
  SCAN_KAMERA=true; render();
  const det=adaDet?new BarcodeDetector({formats:['qr_code']}):null;
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  SCAN_TIMER=setInterval(async()=>{
    const v=document.getElementById('scanv'); if(!v||v.readyState<2)return;
    let teks=[];
    try{
      if(det){ teks=(await det.detect(v)).map(x=>x.rawValue); }
      else{
        const w=v.videoWidth, h=v.videoHeight; if(!w||!h)return;
        cv.width=w; cv.height=h; cx.drawImage(v,0,0,w,h);
        const im=cx.getImageData(0,0,w,h); const r=jsQR(im.data,w,h,{inversionAttempts:'dontInvert'});
        if(r)teks=[r.data];
      }
    }catch(e){}
    for(const t of teks){
      const code=kodeDariTeks(t); if(!code)continue;
      if(SCAN_TUJUAN){ scanKontinu(code); }
      else { stopKamera(); aksiScan(code); return }
    }
  },300);
}
function stopKamera(){
  if(SCAN_TIMER){clearInterval(SCAN_TIMER); SCAN_TIMER=null}
  if(SCAN_STREAM){SCAN_STREAM.getTracks().forEach(t=>t.stop()); SCAN_STREAM=null}
  SCAN_KAMERA=false;
}
