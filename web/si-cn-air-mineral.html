function palletState(tgl){
  const rows=(D.dus||[]).filter(d=>d.tanggal===tgl);
  const tutup=rows.filter(d=>d.status==='Diproduksi');
  const start=tutup.length?Math.max(...tutup.map(d=>+d.nomor||0))+1:1;
  const palet=tutup.length?Math.max(...tutup.map(d=>+d.palet||0))+1:1;
  const sisa=rows.filter(d=>d.status==='Dicetak'&&(+d.nomor)>=start);
  return {rows,start,palet,sisa};
}

  try{

let AUDIO_CTX=null;
function bunyi(ok){
  try{
    AUDIO_CTX=AUDIO_CTX||new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO_CTX.state==='suspended')AUDIO_CTX.resume();
    const t0=AUDIO_CTX.currentTime;
    const nada=(f,mulai,durasi)=>{const o=AUDIO_CTX.createOscillator(), g=AUDIO_CTX.createGain();
      o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(0.3,t0+mulai);
      g.gain.exponentialRampToValueAtTime(0.001,t0+mulai+durasi); o.connect(g); g.connect(AUDIO_CTX.destination);
      o.start(t0+mulai); o.stop(t0+mulai+durasi+0.02);};
    if(ok){ nada(1600,0,0.07); if(navigator.vibrate)navigator.vibrate(40); }
    else { nada(300,0,0.18); nada(220,0.22,0.22); if(navigator.vibrate)navigator.vibrate([150,80,150]); }
  }catch(e){}
}

  catch(e){ MU_MSG='Gagal simpan: '+e.message }

  updScanBox();

async function muatScan(code){ SCAN_RES=false;
  const d=(D.dus||[]).find(x=>x.id===code), mu=(D.muatan||[]).find(m=>m.id===MU_ID);

  if(!d){MU_MSG=`${code} tidak ada di sistem.`; return}

  if(d.status==='Dimuat'){MU_MSG=d.muatan_id===MU_ID?`${code} sudah tercatat di muatan ini.`:`${code} sudah dimuat di kendaraan lain.`; return}
  const row=stamp({...d,status:'Dimuat',muatan_id:MU_ID,kendaraan:mu.kendaraan,sopir:mu.sopir,muat_tgl:TODAY,muat_jam:jamNow()},d);
  await putRetry('dus',row); setLocal('dus',row);
  MU_MSG=`${code} dimuat.`; SCAN_RES=true;
}

async function muatTutup(){

  const jml=N(mu.jumlah), terj=notaQty(mu.id), kb=Math.floor(N(document.getElementById('mukem')?.value));

  if(selisih>0&&!ket){MU_MSG=`Ada ${selisih} dus tidak tercatat kembali maupun terjual. Isi keterangan selisih dulu (hilang / rusak / masih di jalan).`; render(); return}
  const row=stamp({...mu,status:'Selesai',kembali:kb,terjual:terj,selisih,selisih_ket:selisih>0?ket:'',kembali_jam:jamNow()},mu);
  await putRetry('muatan',row); setLocal('muatan',row);
  MU_MSG=selisih>0?`Muatan ditutup dengan selisih ${selisih} dus (${ket}).`:'Muatan ditutup. Dus kembali dan terjual sudah sesuai.';

async function jualScan(code){
  SCAN_RES=false;
  const d=(D.dus||[]).find(x=>x.id===code);
  if(!d){MU_MSG=`${code} tidak ada di sistem.`; return}
  if(d.muatan_id!==JUAL_MU){MU_MSG=`${code} bukan dari kendaraan yang dipilih.`; return}
  if(d.status==='Terjual'){MU_MSG=`${code} sudah terjual (${d.pelanggan||'–'}).`; return}
  if(d.status!=='Dimuat'){MU_MSG=`${code} tidak sedang di mobil.`; return}
  const notas=(D.penjualan||[]).filter(p=>p.muatan_id===JUAL_MU).sort((x,y)=>String(x.no).localeCompare(String(y.no)));
  const nota=notas.find(p=>(D.dus||[]).filter(x=>x.nota_no===p.no).length<N(p.dus)+N(p.bonus));
  if(!nota){MU_MSG=`${code}: tidak ada nota yang menunggu dus ini. Buat nota dulu di menu Penjualan.`; return}
  const row=stamp({...d,status:'Terjual',jual_tgl:TODAY,jual_jam:jamNow(),sales:nota.sales||meName(),pelanggan:nota.pelanggan_nama||nota.pelanggan||'Tunai umum',nota:nota.no,nota_no:nota.no},d);
  await putRetry('dus',row); setLocal('dus',row);
  MU_MSG=`${code} turun, dicatat ke nota ${nota.no}.`; SCAN_RES=true;
}

function penjualanHarianHTML(c){

  let rows=c.inv.filter(i=>i.tanggal===d);
  if(sales) rows=rows.filter(i=>i.sales===meName());
  const baseRows=rows;
  const pem=D.pembayaran.filter(b=>b.tanggal===d && (!sales || c.invByNo[b.ref]?.sales===meName() || b.dibuat_oleh===meName()));
  const pemTunai=pem.filter(b=>b.jenis==='Penjualan tunai').reduce((a,b)=>a+N(b.nominal),0);
  const pemTagih=pem.filter(b=>b.jenis==='Penagihan piutang').reduce((a,b)=>a+N(b.nominal),0);
  const jualTunai=baseRows.filter(i=>i.jenis==='Tunai').reduce((a,i)=>a+N(i.bersih),0);
  const jualKredit=baseRows.filter(i=>i.jenis==='Kredit').reduce((a,i)=>a+N(i.bersih),0);
  const q=(F.q_pjh||'').toLowerCase().trim();
  if(q) rows=rows.filter(i=>(String(i.pelNama)+' '+String(i.no)+' '+String(i.sales)).toLowerCase().includes(q));
  const dus=rows.reduce((a,i)=>a+N(i.dus),0), bonus=rows.reduce((a,i)=>a+N(i.bonus),0);
  const bersih=rows.reduce((a,i)=>a+N(i.bersih),0), bayar=rows.reduce((a,i)=>a+N(i.bayar),0), sisa=rows.reduce((a,i)=>a+N(i.sisa),0);
  const cols=[
    {h:'No. invoice',f:i=>`<span class="mono">${esc(i.no)}</span>`},
    {h:'Pelanggan',f:i=>`<b>${esc(i.pelNama)}</b><span class="sub">${esc(i.wilNama||'')}</span>`},
    ...(sales?[]:[{h:'Sales',f:i=>esc(i.sales)}]),
    {h:'Jenis',f:i=>esc(i.jenis)},
    {h:'Dus',c:'num',f:i=>nf(i.dus,0)+(N(i.bonus)?`<span class="sub">+${i.bonus} bonus</span>`:'')},
    ...(money?[{h:'Total',c:'num',f:i=>`<b>${rp(i.bersih)}</b>`},{h:'Status',f:i=>invChip(i)}]:[])
  ];
  return `<div class="card" style="margin-bottom:14px"><h2>Penjualan ${d===TODAY?'hari ini':'tanggal '+tgl(d)}</h2>
  <div class="filters"><label>Tanggal <input type="date" data-f="tgl_pj" value="${esc(d)}"></label>${searchF('q_pjh','Cari pelanggan / sales / no. invoice')}</div>
  <div class="kpis">${kpi('Nota',String(rows.length),sales?'milik saya':'semua sales','hl')}${kpi('Dus terjual',nf(dus,0),bonus?`+ ${nf(bonus,0)} dus bonus`:'')}${money?kpi('Total penjualan',rp(bersih)):''}${money?kpi('Sudah dibayar',rp(bayar)):''}${money?kpi('Sisa',rp(sisa)):''}</div>
  ${money?`<div class="kpis">${kpi('Pemasukan tunai',rp(pemTunai),'penjualan tunai','hl')}${kpi('Penagihan masuk',rp(pemTagih),'pelunasan & panjar')}${kpi('Terjual tunai',rp(jualTunai),'nilai nota tunai')}${kpi('Terjual kredit',rp(jualKredit),'nilai nota kredit')}</div>`:''}
  ${rows.length?tbl(cols,rows,{}):'<p class="muted" style="margin:8px 0 0">Belum ada penjualan di tanggal ini.</p>'}</div>`;
}

  rafP=false; const app=$('#app');
  if(ME&&ME.role==='owner'&&ready()){const od=ownerDoc();if(!od||getTok()!==od.hash){setMe(null);setTok(null);loginRole='owner'}}
  if(ME&&ME.role==='owner'&&!ready()){app.innerHTML='<div class="loading">Memuat…</div>';return}
  if(!ME||!NAV[ME.role]){app.innerHTML=loginView();return}
  const rs=routes(); if(!ROUTE){try{ROUTE=localStorage.getItem('cn_route')}catch(e){}} if(!rs.includes(ROUTE))ROUTE=rs[0];
  if(!SCAN_CODE){try{const s=sessionStorage.getItem('cn_dus'); if(s){SCAN_CODE=s; sessionStorage.removeItem('cn_dus')}}catch(e){}}
  if(SCAN_CODE&&rs.includes('telusur'))ROUTE='telusur';
  const act=document.activeElement; const fk=act&&act.dataset&&act.dataset.f; let pos=null; try{pos=act.selectionStart}catch(e){}
  let html; try{html=ready()?V[ROUTE]():''}catch(e){console.error(e);html=`<div class="note warn">Halaman gagal ditampilkan: ${esc(e.message)}</div>`}
  app.innerHTML=shell(html);
  attachKamera();
  if(fk){const el=document.querySelector(`[data-f="${fk}"]`);if(el&&el.tagName==='INPUT'){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}

/* ---------- event global ---------- */
document.addEventListener('click',e=>{
  if(e.target.matches('[data-mback]')){closeModal();return}
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
  const a=e.target.closest('[data-act]'); if(a){const fn=ACT[a.dataset.act]; if(fn){e.preventDefault(); if(typeof catatLog==='function'&&a.dataset.act!=='logRefresh'&&a.dataset.act!=='logout')catatLog('Tekan tombol',(a.textContent||a.dataset.act).trim().replace(/\s+/g,' ').slice(0,80)); fn(a.dataset)}}
});
document.addEventListener('change',e=>{if(e.target.id==='impFile'){impFile(e.target.files[0]);e.target.value='';return}const f=e.target.closest('[data-f]');if(f&&f.tagName==='SELECT'&&!f.closest('.modal')){if(f.dataset.f==='impType'){IMPS.prep=null;IMPS.msg=''}F[f.dataset.f]=f.value;render()}});
document.addEventListener('input',e=>{const f=e.target.closest('[data-f]');if(f&&f.tagName==='INPUT'){F[f.dataset.f]=f.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='oform'){e.preventDefault();ownerSubmit(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});
init();
</script>
