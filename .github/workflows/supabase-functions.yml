name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy audit-dokumen, laporan-harian, midtrans-link
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy audit-dokumen --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy laporan-harian --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy midtrans-link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Deploy midtrans-notif (tanpa verifikasi JWT)
        run: supabase functions deploy midtrans-notif --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF" --yes
